<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2438">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>사진대지</title>
<style>
:root{
  --bg:#f3f4f7;--card:#fff;--ink:#151922;--muted:#667085;--line:#e3e6ec;
  --head:#1b2438;--head-ink:#fff;
  --accent:#f2a900;--accent-ink:#231800;--accent-soft:#fff4d6;--bad:#c62828;--ok:#1b7f4b;
  --l1:#d93a32;--l2:#12975a;--l0:#4b5a78;
  --r:14px;--font:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1218;--card:#1a1f2b;--ink:#eef0f5;--muted:#9aa3b5;--line:#2c3342;--head:#121827;--accent-soft:#3a2f08;--bad:#ff8a80;--ok:#5fd29a;--l1:#ff6b63;--l2:#3ccf8a;--l0:#8fa0c4}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--head);color:var(--head-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .cnt{font-size:13px;opacity:.8}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:inherit;border-radius:10px;min-width:44px;height:40px;font:700 18px var(--font);cursor:pointer}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--muted);font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],select{width:100%;height:46px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:44px;border:0;background:var(--card);color:var(--ink);font:600 15px var(--font);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px}
.stepper button{width:48px;height:100%;border:0;background:var(--card);color:var(--ink);font:700 20px var(--font);cursor:pointer}
.stepper span{flex:1;text-align:center;font-weight:700}
.preview{margin-top:10px;padding:8px 10px;background:var(--accent-soft);border-radius:10px;font-size:13px;word-break:break-all}
.preview b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.slot .cap{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.slot .cap small{font-weight:400;color:var(--muted)}
.tile{position:relative;width:100%;aspect-ratio:var(--ratio,1.414);background:#e8e8e2;border:2px dashed var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center}
.tile canvas{width:100%;height:100%;display:block}
.tile.has{border-style:solid;border-color:var(--line)}
.tile.target{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.tile input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.slotbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.slotbtns .btn{height:40px;font-size:13px;padding:0 4px;white-space:nowrap}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--font);cursor:pointer;overflow:hidden}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.btn[disabled]{opacity:.45}
.btn.bulk{width:100%;margin:0 0 12px;height:48px;border-color:var(--accent)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:6px}
.warn{margin-top:8px;font-size:12px;color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar .btn{flex:1;max-width:340px;height:52px;font-size:16px}
#tray{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:15;background:var(--card);border:1px solid var(--accent);border-radius:var(--r);padding:10px;margin:0 0 14px}
#tray .t{font-size:13px;margin-bottom:6px}
#tray .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
#tray .strip img{height:72px;width:96px;object-fit:cover;border-radius:8px;border:3px solid transparent;flex:none}
#tray .strip img.sel{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .btn{width:100%;margin-top:8px;height:50px}
.adj{position:relative;margin:6px 0 10px;touch-action:none;background:#e8e8e2;border-radius:8px;overflow:hidden;aspect-ratio:var(--ratio,1.414)}
.adj canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.pg{position:absolute;left:0;top:0;margin:6px;display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.65);border-radius:8px;padding:3px;z-index:2}
.pg button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:6px;font:700 14px var(--font);min-width:34px;height:32px;cursor:pointer;padding:0 8px}
.chip{margin-top:8px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 13px var(--font);cursor:pointer;text-align:left;max-width:100%}
.pitem{display:block;width:100%;text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:10px 4px;min-height:52px;font:inherit;color:var(--ink);cursor:pointer}
.pitem b{display:block;font-size:16px}
.pitem small{display:block;color:var(--muted);font-size:12px;word-break:break-all}
#partList{max-height:52vh;overflow:auto;margin:8px 0}
.hseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.hseg button{flex:1;height:42px;border:0;background:var(--card);color:var(--ink);font:600 14px var(--font);cursor:pointer}
.hseg button+button{border-left:1px solid var(--line)}
.hseg button.on{background:var(--accent);color:var(--accent-ink)}
#histList{max-height:46vh;overflow:auto;margin:8px 0}
.hrow{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 2px;font-size:14px}
.hrow .hwhen{color:var(--muted);font-size:12px;white-space:nowrap}
.htag{display:inline-block;background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin:2px 4px 0 0;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center;white-space:pre-line}
.toast[hidden]{display:none}
.note{font-size:12px;color:var(--muted)}
.vendor{font-size:12px;color:var(--muted);margin-top:4px}

.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.page[hidden]{display:none}
.demo{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;font-size:12px;margin:0 0 12px}
body{padding-bottom:calc(140px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;height:58px;border:0;background:none;color:var(--muted);font:600 12px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.tabs button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--accent)}
.tabs button.on .ic{stroke:var(--accent)}
.bar{bottom:calc(58px + env(safe-area-inset-bottom))!important;padding-bottom:10px!important}
.bar[hidden]{display:none}
.sec{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.sec h2{margin:0}
.sec small{color:var(--muted);font-size:12px}
.prow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:10px 0}
.prow:first-of-type{border-top:0}
.prow .who{flex:1;min-width:0}
.prow .who b{display:block;font-size:16px}
.prow .who small{display:block;color:var(--muted);font-size:12px}
.call{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 14px var(--font);text-decoration:none;flex:none}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--accent-soft);margin-right:6px}
.pill.bad{background:#fde7e5;color:var(--bad)}
.pill.ok{background:#e1f4e8;color:var(--ok)}
.histhead{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:2px 0 8px}
.big{display:flex;gap:10px;margin:0 0 12px}
.big div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.big b{display:block;font-size:28px;line-height:1.1}
.big small{color:var(--muted);font-size:12px}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.bars h4{margin:0 0 6px;font-size:13px;color:var(--muted)}
.brow{display:grid;grid-template-columns:84px 1fr 30px;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.brow i{display:block;height:10px;border-radius:5px;background:var(--accent)}
.brow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow em{font-style:normal;font-weight:700;text-align:right}
.hrow2{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.hrow2 b{display:block;font-size:16px}
.hrow2 small{color:var(--muted);font-size:13px}
.hrow2 .hwhen{color:var(--muted);font-size:13px;white-space:nowrap}
.dtl{margin:0 0 12px}
.dtl summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}

.grp{margin:0 0 14px}
.grp h3{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.cols{display:grid;gap:8px;align-items:start}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.c2{grid-template-columns:repeat(2,1fr)}
.col{min-width:0}
.col .ch{display:flex;align-items:center;justify-content:center;gap:4px;height:30px;border-radius:9px 9px 0 0;color:#fff;font:700 13px var(--font);background:var(--cc,var(--l0))}
.col.l1{--cc:var(--l1)} .col.l2{--cc:var(--l2)} .col.l0{--cc:var(--l0)}
.col .cb{border:1px solid var(--line);border-top:0;border-radius:0 0 9px 9px;overflow:hidden;background:var(--card)}
.sub{font:700 11px var(--font);color:var(--muted);background:var(--bg);padding:3px 8px;letter-spacing:.02em}
.sub.duty{color:var(--accent-ink);background:var(--accent-soft)}
.pc{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:42px;padding:0 8px;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.pc:first-child{border-top:0}
.pc:active{background:var(--accent-soft)}
.pc small{display:block;font-size:10px;font-weight:700;color:var(--muted);line-height:1}
.pc .ic{width:16px;height:16px;color:var(--cc,var(--l0));flex:none}
.empty1{padding:10px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1><span id="ttl">승강업무</span> <span class="cnt" id="cnt"></span></h1>
  <button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button>
</header>
<main>
  <section class="page" id="pgHome">
    <div class="demo">샘플 화면 · 아래 이름·번호는 연습용 가짜 데이터예요</div>
    <div class="card" id="hWork"></div>
    <div class="card" id="hPlan"></div>
    <div class="card" id="hAcc"></div>
  </section>

  <section class="page" id="pgPhoto" hidden>
    <label class="btn bulk"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>사진 한꺼번에 담기 (여러 장 선택)<input type="file" accept="image/*" multiple id="bulkPick" aria-label="사진 여러 장 담기"></label>
    <div id="tray" hidden></div>
    <div id="jobs"></div>
    <p class="note" id="foot"></p>
  </section>

  <section class="page" id="pgHist" hidden>
    <div class="histhead">
      <div class="hseg" id="histPeriod">
        <button data-p="today">오늘</button><button data-p="week">이번주</button><button class="on" data-p="month">이번달</button><button data-p="all">전체</button>
      </div>
      <input type="text" id="histQ" placeholder="역·호기·부품 검색 (예: 이곡, ES3)" autocomplete="off" enterkeyhint="search">
    </div>
    <p class="note">지금은 이 폰에서 만든 사진대지 기록만 모아 보여줘요. 여러 사람이 함께 보는 집계는 서버 연결 뒤에 돼요.</p>
    <div id="histSum"></div>
    <div id="histList"></div>
  </section>
</main>
<div class="bar" id="actBar" hidden>
  <button class="btn" id="addJob">＋ 새 작업</button>
  <button class="btn primary" id="make">사진대지 만들기</button>
</div>
<nav class="tabs" id="tabs" aria-label="메뉴">
  <button data-t="home" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span>홈</span></button>
  <button data-t="photo"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h4l2-3h4l2 3h4v13H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/></svg><span>사진대지</span></button>
  <button data-t="hist"><svg class="ic" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>이력</span></button>
</nav>

<div class="sheet-back" id="adjBack" hidden>
  <div class="sheet">
    <h3 id="adjTitle">사진 위치 맞추기</h3>
    <div class="adj" id="adjBox"><canvas id="adjCv"></canvas></div>
    <p class="note">사진을 <b>손가락으로 끌면 위치 이동</b>, 두 손가락으로 벌리면 확대. ＋/－/↻ 버튼은 각 사진 왼쪽 위에 있어요.</p>
    <button class="btn primary" id="adjDone">완료</button>
  </div>
</div>

<div class="sheet-back" id="outBack" hidden>
  <div class="sheet">
    <h3 id="outTitle">사진대지를 만들었어요</h3>
    <p class="note" id="outInfo"></p>
    <button class="btn primary" id="outUp">① 사무실로 올리기</button>
    <p class="note">인터넷이 안 되면 폰에 보관했다가 연결되면 자동으로 올라가요.</p>
    <button class="btn" id="outSave">폰에 저장</button>
    <div class="preview" id="outGuide"><b>카톡으로 보낼 때</b>폰에 저장 → 카톡 대화방 → <b>＋</b> → <b>파일</b> → <b>다운로드</b> 폴더에서 <span id="outFile"></span> 선택</div>
    <button class="btn" id="outShare" hidden>사진만 다른 앱으로 보내기</button>
    <button class="btn" id="outCopy">카톡용 문구 복사</button>
    <button class="btn danger" id="outClear">보낸 건 사진 비우기</button>
    <button class="btn" id="outClose">닫기</button>
  </div>
</div>

<div class="sheet-back" id="menuBack" hidden>
  <div class="sheet">
    <h3>메뉴</h3>
    <button class="btn" id="mInstall" hidden>앱으로 설치하기</button>
    <button class="btn" id="mUpdate">최신 버전 받기 (작업·사진은 그대로)</button>
    <button class="btn danger" id="mPhotos">모든 작업의 사진 비우기</button>
    <button class="btn danger" id="mAll">작업 전부 지우기</button>
    <p class="note" id="mInfo"></p>
    <button class="btn" id="menuClose">닫기</button>
  </div>
</div>

<div class="sheet-back" id="partBack" hidden>
  <div class="sheet">
    <h3>부품 찾기</h3>
    <input type="text" id="partQ" placeholder="초성이나 글자 (예: ㄱㅇㄷㄹㄹ, 롤러)" autocomplete="off" enterkeyhint="search">
    <div id="partList"></div>
    <button class="btn primary" id="partUse" hidden></button>
    <button class="btn" id="partClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/jszip.min.js"></script>
<script src="xlsm-core.js"></script>
<script src="app.js"></script>
</body>
</html>
