<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e0a100">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>사진대지</title>
<style>
:root{
  --bg:#f4f4f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#dcdcd5;
  --accent:#e0a100;--accent-ink:#241a00;--accent-soft:#fdf3d4;--bad:#b3261e;--ok:#1d7a46;
  --r:12px;--font:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#161614;--card:#222220;--ink:#f1f1ec;--muted:#a3a39b;--line:#3a3a36;--accent-soft:#3a3000;--bad:#ff8a80;--ok:#66d19e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font)}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .cnt{font-size:13px;opacity:.8}
.iconbtn{background:rgba(0,0,0,.12);border:0;color:inherit;border-radius:10px;min-width:44px;height:40px;font:700 18px var(--font);cursor:pointer}
main{max-width:720px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--muted);font-size:13px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],select{width:100%;height:46px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;height:44px;border:0;background:var(--card);color:var(--ink);font:600 15px var(--font);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;align-items:center}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:46px}
.stepper button{width:48px;height:100%;border:0;background:var(--card);color:var(--ink);font:700 20px var(--font);cursor:pointer}
.stepper span{flex:1;text-align:center;font-weight:700}
.preview{margin-top:10px;padding:8px 10px;background:var(--accent-soft);border-radius:10px;font-size:13px;word-break:break-all}
.preview b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.slot .cap{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.slot .cap small{font-weight:400;color:var(--muted)}
.tile{position:relative;width:100%;aspect-ratio:var(--ratio,1.414);background:#e8e8e2;border:2px dashed var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center}
.tile canvas{width:100%;height:100%;display:block}
.tile.has{border-style:solid;border-color:var(--line)}
.tile.target{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
.tile input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.slotbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.slotbtns .btn{height:40px;font-size:13px;padding:0 4px;white-space:nowrap}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--font);cursor:pointer;overflow:hidden}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
.btn[disabled]{opacity:.45}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:6px}
.warn{margin-top:8px;font-size:12px;color:var(--bad)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.bar .btn{flex:1;max-width:340px;height:52px;font-size:16px}
#tray{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:15;background:var(--card);border:1px solid var(--accent);border-radius:var(--r);padding:10px;margin:0 0 14px}
#tray .t{font-size:13px;margin-bottom:6px}
#tray .strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
#tray .strip img{height:72px;width:96px;object-fit:cover;border-radius:8px;border:3px solid transparent;flex:none}
#tray .strip img.sel{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-back[hidden]{display:none}
.sheet{width:100%;max-width:720px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .btn{width:100%;margin-top:8px;height:50px}
.adj{position:relative;margin:6px 0 10px;touch-action:none;background:#e8e8e2;border-radius:8px;overflow:hidden;aspect-ratio:var(--ratio,1.414)}
.adj canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.pg{position:absolute;left:0;top:0;margin:6px;display:flex;gap:3px;align-items:center;background:rgba(0,0,0,.65);border-radius:8px;padding:3px;z-index:2}
.pg button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:6px;font:700 14px var(--font);min-width:34px;height:32px;cursor:pointer;padding:0 8px}
.chip{margin-top:8px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 13px var(--font);cursor:pointer;text-align:left;max-width:100%}
.pitem{display:block;width:100%;text-align:left;background:var(--card);border:0;border-bottom:1px solid var(--line);padding:10px 4px;min-height:52px;font:inherit;color:var(--ink);cursor:pointer}
.pitem b{display:block;font-size:16px}
.pitem small{display:block;color:var(--muted);font-size:12px;word-break:break-all}
#partList{max-height:52vh;overflow:auto;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;text-align:center;white-space:pre-line}
.toast[hidden]{display:none}
.note{font-size:12px;color:var(--muted)}
.vendor{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>사진대지 <span class="cnt" id="cnt"></span></h1>
  <button class="iconbtn" id="menuBtn" aria-label="메뉴">⋯</button>
</header>
<main>
  <div id="tray" hidden></div>
  <div id="jobs"></div>
  <p class="note" id="foot"></p>
</main>
<div class="bar">
  <button class="btn" id="addJob">＋ 새 작업</button>
  <button class="btn primary" id="make">사진대지 만들기</button>
</div>

<div class="sheet-back" id="adjBack" hidden>
  <div class="sheet">
    <h3 id="adjTitle">사진 위치 맞추기</h3>
    <div class="adj" id="adjBox"><canvas id="adjCv"></canvas></div>
    <p class="note">사진을 <b>손가락으로 끌면 위치 이동</b>, 두 손가락으로 벌리면 확대. ＋/－/↻ 버튼은 각 사진 왼쪽 위에 있어요.</p>
    <button class="btn primary" id="adjDone">완료</button>
  </div>
</div>

<div class="sheet-back" id="outBack" hidden>
  <div class="sheet">
    <h3 id="outTitle">사진대지를 만들었어요</h3>
    <p class="note" id="outInfo"></p>
    <button class="btn primary" id="outShare">카톡·다른 앱으로 보내기</button>
    <button class="btn" id="outSave">폰에 저장</button>
    <button class="btn" id="outCopy">카톡용 문구 복사</button>
    <button class="btn danger" id="outClear">보낸 건 사진 비우기</button>
    <button class="btn" id="outClose">닫기</button>
  </div>
</div>

<div class="sheet-back" id="menuBack" hidden>
  <div class="sheet">
    <h3>메뉴</h3>
    <button class="btn" id="mInstall" hidden>앱으로 설치하기</button>
    <button class="btn danger" id="mPhotos">모든 작업의 사진 비우기</button>
    <button class="btn danger" id="mAll">작업 전부 지우기</button>
    <p class="note" id="mInfo"></p>
    <button class="btn" id="menuClose">닫기</button>
  </div>
</div>

<div class="sheet-back" id="partBack" hidden>
  <div class="sheet">
    <h3>부품 찾기</h3>
    <input type="text" id="partQ" placeholder="초성이나 글자 (예: ㄱㅇㄷㄹㄹ, 롤러)" autocomplete="off" enterkeyhint="search">
    <div id="partList"></div>
    <button class="btn primary" id="partUse" hidden></button>
    <button class="btn" id="partClose">닫기</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="vendor/jszip.min.js"></script>
<script src="xlsm-core.js"></script>
<script src="app.js"></script>
</body>
</html>
